  function unscr(s){var r='';for(var i=s.length-1;i>=0;i--)r+=s[i];return atob(r);}

    try{
      var o=JSON.parse(unscr(_p));
      var k=await crypto.subtle.importKey('raw', b64d(o.k).buffer, {name:'AES-GCM'}, false, ['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(o.iv)}, k, b64d(o.d).buffer);

    }catch(e){ document.body.textContent='Failed to load.'; }
